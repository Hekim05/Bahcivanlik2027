<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahçıvanlık 2027</title>
<meta name="theme-color" content="#2f6b3a">
<meta name="description" content="Bahçıvanlık Eğitimi 2027 hazırlık dosyası – program, yazılar, listeler ve ilerleme takibi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bahçıvanlık 2027">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <div class="brand-title">Bahçıvanlık Eğitimi 2027</div>
      <div class="brand-sub">Park ve Bahçeler Müdürlüğü · Kent Tarım Birimi</div>
    </div>
    <button class="sync" id="syncBtn" type="button" aria-label="Bağlantı durumu"><span class="dot" id="syncDot"></span><span id="syncTxt">Bağlanıyor</span></button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Ayarlar" title="Ayarlar">⚙️</button>
  </div>
  <div class="progress" aria-label="Tamamlanma">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="progress-txt" id="progTxt">%0</div>
  </div>
</header>
<section class="dash" id="dash" aria-label="Gösterge paneli"></section>

<nav class="nav" id="nav" aria-label="Bölümler"></nav>

<main id="main"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet-back" id="sheetBack" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="xlsxFile" accept=".xlsx,.xls,.csv,.ods,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>

<script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script defer src="data.js"></script>
<script defer src="export.js"></script>
<script defer src="app.js"></script>
</body>
</html>
